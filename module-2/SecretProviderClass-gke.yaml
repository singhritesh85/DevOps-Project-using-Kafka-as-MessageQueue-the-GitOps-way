---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    keyvaultName: "multicloud"
    tenantId: "8a0fce19-3824-4678-8769-b6c8e37a33ff"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: multicloud-keystore-truststore-server-password
          objectType: secret

  secretObjects:
    - secretName: keystore-truststore-credentials
      type: Opaque
      data:
        - objectName: multicloud-keystore-truststore-server-password
          key: password
